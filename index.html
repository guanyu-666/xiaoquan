<title>小圈 · 生活小本子</title>

<style>
/* ===================== 基础与主题 ===================== */
:root{
  --bg:#FFF7FA; --card:#FFFFFF; --text:#4B4453; --muted:#9C94A6; --line:#F2ECF1;
  --pink:#FF9FB6; --pink-s:#FFE6ED; --blue:#8FD3F4; --blue-s:#E4F4FD;
  --mint:#A9E5C8; --mint-s:#E3F7EE; --yellow:#FFDE96; --yellow-s:#FFF5DC;
  --purple:#CFC2FF; --purple-s:#EFEBFF; --danger:#FF8A8A;
  --r:20px; --sd:0 6px 18px rgba(255,159,182,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit;}
button{border:0;background:none;padding:0;cursor:pointer;}
h2,h3,h4{margin:0;}
ul{margin:0;padding:0;list-style:none;}
img{display:block;max-width:100%;}
.hidden{display:none !important;}

/* ===================== 布局 ===================== */
.app{max-width:520px;margin:0 auto;padding:0 14px calc(88px + env(safe-area-inset-bottom));}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(12px + env(safe-area-inset-top)) 4px 10px;
  background:linear-gradient(180deg,var(--bg) 70%,rgba(255,247,250,0));
}
.topbar .logo{width:30px;height:30px;}
.topbar h1{font-size:18px;margin:0;letter-spacing:.5px;}
.topbar .tag{margin-left:auto;font-size:12px;color:var(--muted);}

/* ===================== 卡片 / 通用 ===================== */
.card{
  background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:var(--sd);
}
.card.soft{background:linear-gradient(180deg,#fff,#FFF8FB);}
.row{display:flex;align-items:center;gap:8px;}
.row.between{justify-content:space-between;}
h3{font-size:15px;}
.sub,.tip{color:var(--muted);font-size:12.5px;margin:4px 0 0;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}
.chip{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
  background:var(--pink-s);color:#E4728F;
}
.chip.b{background:var(--blue-s);color:#4AA3D0;}
.chip.m{background:var(--mint-s);color:#4BAE85;}
.chip.y{background:var(--yellow-s);color:#C79A32;}
.chip.p{background:var(--purple-s);color:#8778D8;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:10px 14px;border-radius:14px;background:var(--pink);color:#fff;
  font-size:14px;font-weight:600;box-shadow:0 4px 10px rgba(255,159,182,.32);
}
.btn:active{transform:scale(.97);}
.btn.ghost{background:#fff;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line);}
.btn.danger{background:#fff;color:var(--danger);box-shadow:inset 0 0 0 1.5px #FFD9D9;}
.btn.mini{padding:6px 12px;font-size:13px;border-radius:12px;}
.btn.full{width:100%;}
.btn.big{padding:16px;font-size:17px;border-radius:18px;}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.btnrow .btn{flex:1 1 46%;}
.link{font-size:12.5px;color:var(--muted);padding:4px 6px;}
.link.del{color:var(--danger);}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0;}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;
  background:#FFFDFE;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--pink);}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px 4px;}

/* 分段选择 */
.seg{display:flex;background:#F7F2F6;border-radius:14px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px 0;border-radius:11px;font-size:13.5px;color:var(--muted);}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chips button{padding:7px 13px;border-radius:99px;background:#F7F2F6;font-size:13px;color:var(--muted);}
.chips button.on{background:var(--pink-s);color:#E4728F;font-weight:600;}

/* 开关 */
.sw{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.sw input{display:none;}
.sw i{width:38px;height:22px;border-radius:99px;background:#E9E2EA;position:relative;transition:.2s;}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.sw input:checked + i{background:var(--pink);}
.sw input:checked + i::after{left:18px;}

/* ===================== 首页 ===================== */
.hi{display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#FFEFF4,#F1F8FF);}
.hi h2{font-size:19px;}
.hi .mascot{margin-left:auto;flex:none;}
.mascot{width:88px;height:88px;cursor:pointer;animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mascot:active{transform:scale(.92);}
.bubble{
  position:relative;margin:-4px 0 12px;padding:11px 14px;border-radius:16px;
  background:#fff;box-shadow:var(--sd);font-size:13.5px;color:#6B6478;
}
.bubble::before{content:"";position:absolute;top:-7px;right:38px;border:7px solid transparent;border-bottom-color:#fff;border-top:0;}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-head .ym{font-size:16px;font-weight:700;}
.cal-head button{width:30px;height:30px;border-radius:50%;background:#F7F2F6;color:var(--muted);font-size:15px;}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-week div{text-align:center;font-size:11.5px;color:var(--muted);padding:4px 0;}
.cal-grid .cell{
  position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  border-radius:12px;font-size:14px;
}
.cal-grid .cell.empty{visibility:hidden;}
.cal-grid .cell.today{box-shadow:inset 0 0 0 1.5px var(--pink);color:#E4728F;font-weight:700;}
.cal-grid .cell.sel{background:var(--pink);color:#fff;font-weight:700;}
.cal-grid .cell .dot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--pink);}
.cal-grid .cell.sel .dot{background:#fff;}

/* 列表项 */
.item{
  display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);
}
.item:first-child{border-top:0;}
.thumb{
  width:52px;height:52px;flex:none;border-radius:16px;background:var(--pink-s) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;
}
.thumb.b{background-color:var(--blue-s);}
.thumb.m{background-color:var(--mint-s);}
.thumb.y{background-color:var(--yellow-s);}
.item .grow{flex:1;min-width:0;}
.item .t{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;}
.item .s b{color:var(--pink);font-size:14px;}
.item-foot{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}

/* 底部导航 */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  max-width:520px;margin:0 auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
}
.tabbar button{flex:1;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;}
.tabbar button .ic{font-size:20px;line-height:1;}
.tabbar button.on{color:var(--pink);font-weight:700;}

/* ===================== 食谱 ===================== */
.roll{
  text-align:center;padding:18px 10px;border-radius:18px;
  background:linear-gradient(135deg,#FFF3E6,#FFEAF1);
}
.roll .res{font-size:22px;font-weight:800;margin:6px 0 2px;word-break:break-all;}
.roll .resimg{width:120px;height:120px;border-radius:22px;margin:8px auto;background:#fff center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:var(--sd);}
.foodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px;}
.food{background:#FFF9FB;border-radius:16px;padding:9px 6px;text-align:center;font-size:12.5px;position:relative;overflow:hidden;}
.food .fi{width:100%;aspect-ratio:1/1;border-radius:12px;background:#fff center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:5px;}
.food .x{position:absolute;top:3px;right:5px;font-size:13px;color:var(--muted);}

/* ===================== 记账 ===================== */
.sum{display:flex;gap:8px;text-align:center;}
.sum div{flex:1;background:#FFF9FB;border-radius:16px;padding:10px 4px;}
.sum .n{font-size:17px;font-weight:800;}
.sum .l{font-size:11.5px;color:var(--muted);}
.in{color:#4BAE85;} .out{color:#F0839C;}
.bar{height:10px;border-radius:99px;background:var(--mint-s);overflow:hidden;margin-top:10px;}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px;}

/* ===================== 弹层 / Toast ===================== */
.mask{position:fixed;inset:0;z-index:50;background:rgba(75,68,83,.35);display:flex;align-items:flex-end;justify-content:center;}
.sheet{
  width:100%;max-width:520px;max-height:86vh;overflow:auto;background:#fff;
  border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px;position:sticky;top:0;background:#fff;}
.sheet-bar span{font-size:16px;font-weight:700;}
.sheet-bar button{width:28px;height:28px;border-radius:50%;background:#F7F2F6;color:var(--muted);}
.imgpick{
  width:100%;height:120px;border-radius:18px;background:#FFF9FB center/cover no-repeat;
  border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;margin-bottom:10px;
}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);
  background:rgba(75,68,83,.92);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;
  z-index:99;opacity:0;transition:.22s;pointer-events:none;max-width:80%;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===================== 新增模块样式（追加，不改动上方） ===================== */
/* 每日计划 */
.plan .t.done{text-decoration:line-through;color:var(--muted);}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
.check.on{background:var(--pink);border-color:var(--pink);}

/* 目标打卡 */
.gcard{border-left:5px solid var(--c,var(--pink));}
.quickcheck{display:flex;gap:6px;margin-top:8px;align-items:center;}
.quickcheck input{width:92px;}
.grec{font-size:12.5px;color:var(--muted);padding:7px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.grec .v{color:var(--pink);font-weight:700;margin-left:auto;}
.weekly{border:1.5px dashed var(--pink);}
.wr-item{border-top:1px solid var(--line);padding:10px 0;}
.wr-item .d{font-size:12.5px;color:var(--muted);margin-top:2px;}

/* 记录本 */
.nb-seg{margin-bottom:4px;}
.diary{position:relative;border-radius:18px;overflow:hidden;min-height:120px;padding:14px;color:#fff;box-shadow:var(--sd);
  background:linear-gradient(135deg,#FF9FB6,#CFC2FF);}
.diary .cover{position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:0;}
.diary .cc{position:relative;z-index:1;}
.diary .dt{font-size:11.5px;opacity:.92;}
.diary .ti{font-size:17px;font-weight:800;margin:3px 0;}

/* 书籍 */
.book{display:flex;gap:10px;}
.book .info{flex:1;min-width:0;}
.book .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.status{font-size:11px;padding:2px 8px;border-radius:99px;}
.status.want{background:var(--blue-s);color:#4AA3D0;}
.status.reading{background:var(--yellow-s);color:#C79A32;}
.status.done{background:var(--mint-s);color:#4BAE85;}
.reader{font-size:var(--rsize,15px);line-height:1.85;white-space:pre-wrap;max-height:58vh;overflow:auto;padding:4px;border-radius:12px;background:#FFFDFE;}
.reader .ln{display:block;}

/* 设置 & 颜色选择 */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);}
.set-row:first-child{border-top:0;}
.cpresets{display:flex;gap:8px;flex-wrap:wrap;}
.cp{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;}
input[type=range]{width:100%;accent-color:var(--pink);}

/* ===================== 新增：图文混排 / 食谱预览 / 单位 ===================== */
/* 日记内联图片 */
.dimg{ max-width:100%;border-radius:14px;margin:8px 0;box-shadow:var(--sd);display:block; }
/* 食谱图片预览大图 */
.resimg.big{ width:160px;height:160px;font-size:64px;margin:6px auto 12px; }
/* 目标单位小标签 */
.gunit{ font-size:12px;padding:3px 9px;border-radius:99px;background:var(--pink-s);color:#E4728F;font-weight:600; }
.gunit:active{ transform:scale(.95); }
/* 食物图片（网格里可点开预览） */
.food .fi{ cursor:pointer; }

/* ===================== 新增：记录本文件夹分组 ===================== */
/* 文件夹筛选条 */
.fbar{ display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-top:10px;-webkit-overflow-scrolling:touch; }
.fbar::-webkit-scrollbar{ display:none; }
.fchip{
  flex:none;padding:6px 12px;border-radius:99px;background:#F7F2F6;font-size:12.5px;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;border:1.5px solid transparent;
}
.fchip b{ font-weight:700;opacity:.7; }
.fchip.on{ background:var(--pink-s);color:#E4728F;font-weight:700;border-color:var(--pink); }
.fchip.add{ background:#fff;color:var(--text);border-style:dashed;border-color:var(--line); }
.fchip:active{ transform:scale(.96); }
.fdot{ width:8px;height:8px;border-radius:50%;display:inline-block;flex:none; }
/* 文件夹头部 */
.fhead{ display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:16px; }
.fhd-cover{ width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:#FFF9FB center/cover no-repeat; }
.fhd-info{ flex:1;min-width:0; }
.fhd-info .t{ font-size:14.5px;font-weight:700;word-break:break-all; }
.fhd-info .s{ font-size:12px;color:var(--muted);margin-top:2px; }
.fhd-act{ display:flex;flex-direction:column;align-items:flex-end;gap:2px; }
/* 条目上的文件夹标签 */
.ftag{ display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;margin-top:3px; }
/* 批量选择 */
.pick{ width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:#fff; }
.pick.on{ background:var(--pink);border-color:var(--pink); }
.pick.on-top{ position:absolute;top:10px;right:10px;z-index:2; }
.item.sel,.diary.sel{ outline:2px solid var(--pink);outline-offset:-2px;border-radius:14px; }
.selbar{ display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;
  border-radius:14px;background:#F7F2F6;font-size:12.5px; }
.selbar b{ color:var(--pink); }
/* 文件夹表单 */
.fcover{ height:110px;border-radius:18px;background:#FFF9FB center/cover no-repeat;display:flex;
  align-items:center;justify-content:center;font-size:34px;margin-bottom:10px;border:1.5px dashed var(--line); }
.covers{ display:flex;gap:8px;flex-wrap:wrap; }
.covers button{ width:46px;height:46px;border-radius:14px;font-size:22px;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center; }
.covers button.on{ border-color:var(--pink);box-shadow:0 2px 8px rgba(255,159,182,.4); }
/* 目标文件夹列表 */
.frow{ display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;border-radius:14px;
  background:#FFF9FB;margin-bottom:8px;font-size:14px;text-align:left; }
.frow .n{ margin-left:auto;font-size:12px;color:var(--muted); }
.frow:active{ transform:scale(.98); }
.mb8{ margin-bottom:8px; }
</style>
</head>

const pad = n => (n < 10 ? '0' : '') + n;
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = () => ymd(new Date());
const parseD = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const DAY = 86400000;
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / DAY);   // b - a，单位天
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* 图片压缩：上传前缩到最大 720px，避免 localStorage 爆容量 */
function compressImg(file, max = 720){
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => resolve('');
      img.src = fr.result;
    };
    fr.onerror = () => resolve('');
    fr.readAsDataURL(file);
  });
}

    ui: {}        // 各模块的界面小状态（themeColor / fontSize / fontColor 等）

}
let DB = (function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaults();
    return Object.assign(defaults(), JSON.parse(raw));
  }catch(e){ return defaults(); }
})();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('保存失败：存储空间可能已满，删几张图片试试'); }
}

const ROUTES = ['home', 'goal', 'notebook', 'money', 'recipe', 'book', 'setting'];
let route = 'home';
let exitArmed = false;

function go(r, push){
  if(!ROUTES.includes(r)) r = 'home';
  route = r;
  if(push) history.pushState({ r: r }, '', '#' + r);
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.r === r));
  $('#topTag').textContent = { home:'今天 ' + TODAY(), goal:'目标打卡 & 周报', notebook:'灵感 & 日记', money:'收支小账本', recipe:'今天吃什么？', book:'书单 & 阅读', setting:'外观与偏好' }[r];
  render();
  window.scrollTo(0, 0);
}
function render(){
  const v = $('#view');
  v.innerHTML = ({ home: viewHome, goal: viewGoal, notebook: viewNoteBook, money: viewMoney, recipe: viewRecipe, book: viewBook, setting: viewSetting })[route]();
}
/* 手机返回键：优先在应用内路由回退；已经在首页时，需要连按两次才允许离开（不会一按就跳回浏览器） */
window.addEventListener('popstate', () => {
  const st = history.state || {};
  if(st.m){ return; }            // 弹层内部状态，无需处理
  closeSheet(true);
  if(st.guard && exitArmed){     // 第二次点击返回 → 真正离开
    exitArmed = false;
    if(history.length > 1) history.go(-1);
    return;
  }
  if(!ROUTES.includes(st.r)){    // 已经退到应用之外 → 拉回应用内
    history.pushState({ r: route, guard: 1 }, '', '#' + route);
    exitArmed = true;
    toast('再按一次返回键离开小圈 ~');
    setTimeout(() => { exitArmed = false; }, 2500);
    return;
  }
  go(st.r, false);
});

/* ---------------------- 5. 弹层 ---------------------- */
let sheetOpen = false;
function openSheet(title, html, onMount){
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  $('#mask').classList.remove('hidden');
  sheetOpen = true;
  history.pushState({ r: route, m: 1 }, '');
  if(onMount) onMount($('#sheetBody'));
}
function closeSheet(fromPop){
  if(!sheetOpen) return;
  $('#mask').classList.add('hidden');
  $('#sheetBody').innerHTML = '';
  sheetOpen = false;
  if(!fromPop) history.back();     // 保持历史栈干净：关闭 = 回退一步
}
/* 自定义确认框（比原生 confirm 可爱一点） */
function confirmBox(title, text, onYes, yesText){
  openSheet(title, `<p style="margin:0 0 14px;font-size:14px;color:#6B6478">${esc(text)}</p>
    <div class="btnrow"><button class="btn ghost" data-act="sheetClose">取消</button>
    <button class="btn" data-act="confirmYes">${esc(yesText || '确定')}</button></div>`,
    body => { body.querySelector('[data-act=confirmYes]').onclick = () => { closeSheet(); onYes && onYes(); }; });
}

function backupCard(){
  return `<section class="card soft">
    <div class="row between"><h3>💾 备份 & 恢复</h3><span class="chip">全部模块数据</span></div>
    <p class="tip">数据只存在这台设备的浏览器里。清理缓存、换手机前，记得先导出一份 JSON 备份。</p>
    <div class="btnrow">
      <button class="btn" data-act="export">导出 JSON</button>
      <button class="btn ghost" data-act="import">导入恢复</button>
      <button class="btn ghost" data-act="copyBackup">复制备份文本</button>
      <button class="btn danger" data-act="clear">清空数据</button>
    </div>
  </section>`;
}
function doExport(){
  const txt = JSON.stringify(DB, null, 2);
  const blob = new Blob([txt], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '小圈备份-' + TODAY() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('备份已导出 ~');
}
function doCopy(){
  const txt = JSON.stringify(DB);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => toast('已复制，粘贴到备忘录保存吧'), () => toast('复制失败，请用导出文件'));
  }else{
    toast('当前环境不支持复制，请用「导出 JSON」');
  }
}
function doImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    let data;
    try{ data = JSON.parse(fr.result); }
    catch(e){ return toast('文件不是合法的 JSON'); }
    if(typeof data !== 'object' || !data) return toast('文件内容不正确');
    openSheet('导入备份', `<p style="margin:0 0 12px;font-size:14px;color:#6B6478">
        检测到备份文件（纪念日 ${(data.days||[]).length} / 食物 ${(data.foods||[]).length} / 账单 ${(data.bills||[]).length} / 目标 ${(data.goals||[]).length} / 打卡 ${(data.goalRecords||[]).length} / 周报 ${(data.weeklyReports||[]).length} / 灵感 ${(data.inspirations||[]).length} / 日记 ${(data.diaries||[]).length} / 文件夹 ${(data.nbFolders||[]).length} / 书单 ${(data.bookList||[]).length} / 本地书 ${(data.localBooks||[]).length}）。<br>请选择导入方式：</p>
      <div class="field"><button class="btn full" data-act="importMerge">合并导入（保留现有数据）</button></div>
      <div class="field"><button class="btn ghost full" data-act="importReplace">覆盖导入（替换现有数据）</button></div>`,
      body => {
        body.querySelector('[data-act=importMerge]').onclick = () => { mergeData(data); closeSheet(); toast('合并完成 ~'); go(route, false); };
        body.querySelector('[data-act=importReplace]').onclick = () => {
          DB = Object.assign(defaults(), data); save(); closeSheet(); toast('已覆盖导入 ~'); go(route, false);
        };
      });
  };
  fr.readAsText(file);
}
function mergeData(d){
  const has = (arr, k, v) => arr.some(x => x[k] === v);
  (d.days || []).forEach(x => { if(!has(DB.days, 'id', x.id)) DB.days.push(x); });
  (d.foods || []).forEach(x => { if(!has(DB.foods, 'id', x.id)) DB.foods.push(x); });
  (d.bills || []).forEach(x => { if(!has(DB.bills, 'id', x.id)) DB.bills.push(x); });
  (d.wrong || []).forEach(x => {
    const f = DB.wrong.find(y => y.w === x.w);
    if(f) f.n = Math.max(f.n, x.n || 1); else DB.wrong.push(x);
  });
  (d.learned || []).forEach(w => { if(!DB.learned.includes(w)) DB.learned.push(w); });
  (d.goals        || []).forEach(x => { if(!has(DB.goals,        'id', x.id)) DB.goals.push(x); });
  (d.goalRecords  || []).forEach(x => { if(!has(DB.goalRecords,  'id', x.id)) DB.goalRecords.push(x); });
  (d.weeklyReports|| []).forEach(x => { if(!has(DB.weeklyReports,'id', x.id)) DB.weeklyReports.push(x); });
  (d.inspirations || []).forEach(x => { if(!has(DB.inspirations, 'id', x.id)) DB.inspirations.push(x); });
  (d.diaries      || []).forEach(x => { if(!has(DB.diaries,      'id', x.id)) DB.diaries.push(x); });
  (d.nbFolders    || []).forEach(x => { if(!has(DB.nbFolders,    'id', x.id)) DB.nbFolders.push(x); });
  (d.bookList     || []).forEach(x => { if(!has(DB.bookList,     'id', x.id)) DB.bookList.push(x); });
  (d.localBooks   || []).forEach(x => { if(!has(DB.localBooks,   'id', x.id)) DB.localBooks.push(x); });
  save();
}
function doClear(){
  confirmBox('清空全部数据？', '所有纪念日、食物、账单、错词都会被删除，且无法恢复。建议先导出备份。', () => {

function hiText(){
  const h = new Date().getHours();
  if(h < 6)  return '夜深啦，早点睡，小圈陪你 ~';
  if(h < 11) return '早上好！今天也要元气满满 ✨';
  if(h < 14) return '中午啦，记得好好吃饭 🍚';
  if(h < 18) return '下午好，喝口水休息一下 ~';
  return '晚上好，今天过得怎么样？';
}
function calCells(){
  const start = new Date(cal.y, cal.m, 1).getDay();
  const total = new Date(cal.y, cal.m + 1, 0).getDate();
  let html = '';
  for(let i = 0; i < start; i++) html += '<div class="cell empty"></div>';
  for(let d = 1; d <= total; d++){
    const ds = ymd(new Date(cal.y, cal.m, d));
    const has = DB.days.some(x => x.date === ds) ||
      DB.days.some(x => x.yearly && x.type === 'memorial' && parseD(x.date).getMonth() === cal.m && parseD(x.date).getDate() === d);
    html += `<div class="cell ${ds === TODAY() ? 'today' : ''} ${ds === cal.sel ? 'sel' : ''}"
      data-act="pickDate" data-date="${ds}"><span>${d}</span>${has ? '<i class="dot"></i>' : ''}</div>`;
  }
  return html;
}
function selDayList(){
  const list = DB.days.filter(x => x.date === cal.sel);
  if(!list.length) return '<div class="empty">这一天还没有记录，点右上角添加 ~</div>';
  return list.map(dayItem).join('');
}
function allDaysList(){
  if(!DB.days.length) return '<div class="empty">还没有纪念日，添加一个吧 ~</div>';
  return DB.days.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(dayItem).join('');
}
function dayText(d){
  const t = TODAY();
  const n = diffDays(t, d.date);            // 正数：还有几天；负数：已过去
  if(n > 0)  return `还有 <b>${n}</b> 天 · ${d.date}`;
  if(n === 0) return `<b>就是今天！</b> · ${d.date}`;
  const passed = -n;
  let extra = '';
  if(d.type === 'memorial' && d.yearly){    // 纪念日可选「每年重复」，算下一个周年
    const src = parseD(d.date);
    let next = new Date(parseD(t).getFullYear(), src.getMonth(), src.getDate());
    if(ymd(next) < t) next.setFullYear(next.getFullYear() + 1);
    extra = ` · 距离 ${next.getFullYear() - src.getFullYear()} 周年还有 ${diffDays(t, ymd(next))} 天`;
  }
  return `已经过去 <b>${passed}</b> 天 · ${d.date}${extra}`;
}
function dayItem(d){
  return `<div class="item" data-id="${d.id}">
    <div class="thumb ${d.type === 'countdown' ? 'b' : ''}" ${d.img ? `style="background-image:url(${d.img})"` : ''}>

function dayForm(d){

function saveDay(id){

let recipeCat = '午饭';

function foodsOf(cat){
  const presets = PRESET_FOODS.filter(f => f.cat === cat);
  const customs = DB.foods.filter(f => f.cat === cat);
  const ovIds = new Set(customs.filter(f => f.override).map(f => f.id));
  // 若某预设已被用户自定义（override），则不再显示原预设，避免重复
  return presets.filter(p => !ovIds.has(p.id)).concat(customs);
}
/* 取食物的有效数据（先查自定义，再查预设） */

  return DB.foods.find(f => f.id === id) || PRESET_FOODS.find(f => f.id === id) || null;

/* ---------------------- 10. 通用工具（UI 颜色混合等） ---------------------- */
function nowStr(){
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function mix(a,b,r){ const A=hexToRgb(a),B=hexToRgb(b); const m=k=>Math.round(A[k]*(1-r)+B[k]*r); return `rgb(${m(0)},${m(1)},${m(2)})`; }
function applyUIStyles(){
  const ui = DB.ui || {};
  const root = document.documentElement.style;
  if(ui.themeColor){
    root.setProperty('--pink', ui.themeColor);
    root.setProperty('--bg', mix(ui.themeColor, '#FFFFFF', 0.88));   // 主题色 → 整页背景
    root.setProperty('--card', mix(ui.themeColor, '#FFFFFF', 0.97)); // 卡片底随主题微调
  }
  if(ui.fontColor){
    root.setProperty('--text', ui.fontColor);
    root.setProperty('--muted', mix(ui.fontColor, '#FFFFFF', 0.42)); // 次要文字跟随字体色
  }
  if(ui.fontSize) document.body.style.fontSize = ui.fontSize + 'px';
}

/* ---------------------- 11. 目标打卡（含周报复盘） ---------------------- */
function sumRecs(recs){ return recs.reduce((s,r)=> s + (Number(r.value)||0), 0); }
function weekRange(d){
  const day = (d.getDay()+6)%7; // 周一=0
  const ws = ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate()-day));
  const we = ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate()-day+6));
  return [ws, we];
}
function weekRecords(goalId){ const r=weekRange(new Date()); return sumRecs(DB.goalRecords.filter(x=> x.goalId===goalId && x.date>=r[0] && x.date<=r[1])); }
function monthRecords(goalId){ const pre=TODAY().slice(0,7); return sumRecs(DB.goalRecords.filter(x=> x.goalId===goalId && (x.date||'').slice(0,7)===pre)); }
function viewGoal(){

/* 把正文里的图片 token 换成占位符，便于列表预览展示 */
function plainDiary(content){
  return String(content || '').replace(/@@IMG:\d+@@/g, '🖼️ ');
}
/* 把正文里的图片 token 渲染成真正的内联图片 */
function renderDiaryContent(content, images){
  return esc(content || '').replace(/@@IMG:(\d+)@@/g, (m, i) => {
    const url = (images || [])[+i];
    return url ? `<img class="dimg" src="${url}" alt="日记图片">` : '';
  });
}
/* 存储前：只保留正文中真正用到的图片，并把 token 重新编号，避免数据膨胀 */
function normalizeDiary(content, images){
  const used = new Set();
  String(content || '').replace(/@@IMG:(\d+)@@/g, (m, i) => { used.add(+i); return m; });
  const sorted = [...used].sort((a, b) => a - b);
  const keep = sorted.map(i => (images || [])[i]).filter(Boolean);
  const map = {}; sorted.forEach((old, n) => { map[old] = n; });
  const newContent = String(content || '').replace(/@@IMG:(\d+)@@/g, (m, i) => '@@IMG:' + map[+i] + '@@');
  return { content: newContent, images: keep };
}
/* 在输入框光标处插入文本 */
function insertAtCursor(el, text){
  if(!el) return;
  const s = el.selectionStart, e = el.selectionEnd, v = el.value;
  el.value = v.slice(0, s) + text + v.slice(e);
  el.selectionStart = el.selectionEnd = s + text.length;
  el.focus();
}

  delGrec: el => { const id=el.closest('.grec').dataset.id; const rec=DB.goalRecords.find(x=>x.id===id); confirmBox('删除这条打卡记录？','',()=>{ DB.goalRecords=DB.goalRecords.filter(x=>x.id!==id); save(); if(rec) openGoal(rec.goalId); }); },
  /* 目标单位：可编辑选项（常用单位 + 自定义） */
  editUnit: el => {
    const id=el.dataset.id; const g=DB.goals.find(x=>x.id===id); if(!g) return;
    const presets=['次','分钟','页','个','公里','元','小时','篇','组','遍'];
    const isPreset = presets.includes(g.unit);
    openSheet('设置单位', `
      <div class="field"><label>常用单位</label>
        <div class="chips" id="unitChips">${presets.map(u=>`<button data-v="${u}" class="${u===g.unit?'on':''}">${u}</button>`).join('')}</div></div>
      <div class="field"><label>自定义单位</label><input type="text" id="uCustom" placeholder="或输入自定义，如：圈 / 遍" value="${isPreset?'':esc(g.unit||'')}"></div>
      <button class="btn full" data-act="saveUnit" data-id="${id}">保存单位</button>`);
  },
  saveUnit: el => {
    const id=el.dataset.id; const g=DB.goals.find(x=>x.id===id); if(!g) return;
    const chip=$('#unitChips .on'); const custom=$('#uCustom').value.trim();
    g.unit = custom || (chip ? chip.dataset.v : '次');
    save(); closeSheet(); render(); toast('单位已设为「' + g.unit + '」');
  },
  saveWeekly: () => {
    const r=weekRange(new Date());
    const body={ weekStart:r[0], weekEnd:r[1], achieve:$('#wrAch').value.trim(), shortage:$('#wrShort').value.trim(), plan:$('#wrPlan').value.trim(), createAt:TODAY() };
    const i=DB.weeklyReports.findIndex(x=>x.weekStart===r[0]);
    if(i>=0) DB.weeklyReports[i]=Object.assign({},DB.weeklyReports[i],body);
    else DB.weeklyReports.push(Object.assign({ id:uid() },body));
    save(); render(); toast('周报已保存 📊');
  },
  editWeekly: el => { const w=DB.weeklyReports.find(x=>x.id===el.dataset.id); openSheet('编辑周报', wrForm(w)); },
  saveWrEdit: el => {
    const id=el.dataset.id; const body={ achieve:$('#wrAch2').value.trim(), shortage:$('#wrShort2').value.trim(), plan:$('#wrPlan2').value.trim() };
    if(id){ const i=DB.weeklyReports.findIndex(x=>x.id===id); DB.weeklyReports[i]=Object.assign({},DB.weeklyReports[i],body); }
    save(); closeSheet(); render(); toast('已更新周报 ~');
  },
  delWeekly: el => { const id=el.dataset.id; confirmBox('删除这条周报？','删除后无法恢复。',()=>{ DB.weeklyReports=DB.weeklyReports.filter(x=>x.id!==id); save(); render(); toast('已删除'); }); },

  /* 记录本 */
  addInsp: () => openSheet('记灵感', inspForm()),
  editInsp: el => { const x=DB.inspirations.find(i=>i.id===el.dataset.id); openSheet('编辑灵感', inspForm(x)); },
  saveInsp: el => {
    const c=$('#iContent').value.trim(); if(!c) return toast('写点什么吧 ~');
    const id=el.dataset.id;
    if(id){ const i=DB.inspirations.findIndex(x=>x.id===id); DB.inspirations[i].content=c; }
    else DB.inspirations.push({ id:uid(), content:c, folderId:nbDefFolder(), createAt:nowStr() });
    save(); closeSheet(); render(); toast('已保存 ~');
  },
  delInsp: el => { const id=el.dataset.id; confirmBox('删除这条灵感？','',()=>{ DB.inspirations=DB.inspirations.filter(x=>x.id!==id); save(); render(); toast('已删除'); }); },
  addDiary: () => { curImg=''; openSheet('写日记', diaryForm()); },
  editDiary: el => { const d=DB.diaries.find(x=>x.id===el.dataset.id); curImg=d.coverImg||''; openSheet('编辑日记', diaryForm(d)); },
  saveDiary: el => {
    const title=$('#dTitle').value.trim(); const content=$('#dContent').value.trim(); if(!content) return toast('日记内容不能为空 ~');
    const id=el.dataset.id;
    const norm = normalizeDiary(content, diaryImages);
    const prev = id ? DB.diaries.find(x=>x.id===id) : null;
    const item={ id:id||uid(), title:title, content:norm.content, coverImg:curImg, images:norm.images,
      folderId: prev ? (prev.folderId || '') : nbDefFolder(),
      createAt: prev ? prev.createAt : nowStr() };
    if(id){ const i=DB.diaries.findIndex(x=>x.id===id); DB.diaries[i]=Object.assign({},DB.diaries[i],item); }
    else DB.diaries.push(item);
    save(); closeSheet(); render(); toast('日记已存 ✏️');
  },
  /* 日记正文里插入一张图片（图片与正文 token 一一对应，支持图文混排） */
  insertDiaryImg: () => pickImage(url => {
    if(!url) return;
    diaryImages.push(url);
    const token = '@@IMG:' + (diaryImages.length - 1) + '@@';
    insertAtCursor($('#dContent'), (($('#dContent').value && !/[\n]$/.test($('#dContent').value)) ? '\n' : '') + token + '\n');
    toast('图片已插入，可继续写文字 ~');
  }),
  openDiary: el => openDiary(el.dataset.id),
  delDiary: el => { const id=el.dataset.id; confirmBox('删除这篇日记？','删除后无法恢复。',()=>{ DB.diaries=DB.diaries.filter(x=>x.id!==id); save(); render(); toast('已删除'); }); },

  /* 记录本 · 文件夹（分组）管理 */
  nbFilter: el => { nbSetFolder(el.dataset.v); nbSelIds = []; render(); },
  addFolder: () => { curImg = ''; curCoverPreset = 'c1'; openSheet('新建文件夹', folderForm()); },
  editFolder: el => { const f = nbFolderOf(el.dataset.id); if(!f) return toast('文件夹不存在'); openSheet('编辑文件夹', folderForm(f)); },
  saveFolder: el => {
    const name = $('#fdName').value.trim();
    if(!name) return toast('给文件夹起个名字吧 ~');
    const color = $('#fdColor').value || '#FF9FB6';
    const cover = curImg || (curCoverPreset ? 'preset:' + curCoverPreset : '');
    const id = el.dataset.id;
    if(id){
      const i = DB.nbFolders.findIndex(x => x.id === id);
      if(i >= 0){ DB.nbFolders[i].name = name; DB.nbFolders[i].cover = cover; DB.nbFolders[i].colorHex = color; }
      else return toast('文件夹不存在，保存失败');
    } else DB.nbFolders.push({ id: uid(), name, cover, colorHex: color });
    save(); closeSheet(); render(); toast(id ? '文件夹已更新 ~' : '文件夹已创建 📁');
  },
  delFolder: el => {
    const id = el.dataset.id; const f = nbFolderOf(id);
    if(!f) return toast('文件夹不存在');
    const n = DB.diaries.filter(x => (x.folderId || '') === id).length + DB.inspirations.filter(x => (x.folderId || '') === id).length;
    confirmBox('删除文件夹「' + f.name + '」？',
      n ? '里面的 ' + n + ' 条内容不会被删除，会自动移入「未分组」。文件夹本身删除后无法恢复。'
        : '这个文件夹是空的，删除后无法恢复。',
      () => {
        DB.diaries.forEach(x => { if((x.folderId || '') === id) x.folderId = ''; });
        DB.inspirations.forEach(x => { if((x.folderId || '') === id) x.folderId = ''; });
        DB.nbFolders = DB.nbFolders.filter(x => x.id !== id);
        if(inspFolder === id) inspFolder = 'all';
        if(diaryFolder === id) diaryFolder = 'all';
        save(); render(); toast('已删除文件夹，内容已移到未分组');
      }, '删除文件夹');
  },
  pickFolderCover: () => pickImage(url => {
    if(!url) return toast('图片读取失败，换一张试试');
    curImg = url; curCoverPreset = '';
    $$('#fdCovers button').forEach(b => b.classList.remove('on'));
    const p = $('#fdPrev');
    if(p){ p.style.background = 'url(' + url + ') center/cover no-repeat'; p.textContent = ''; }
    toast('封面已更新 ~');
  }),
  /* 批量移动 */
  nbSelectMode: () => { nbSelect = !nbSelect; nbSelIds = []; render(); },
  nbExitSel: () => { nbSelect = false; nbSelIds = []; render(); },
  nbToggleSel: el => {
    const id = el.dataset.id, i = nbSelIds.indexOf(id);
    if(i >= 0) nbSelIds.splice(i, 1); else nbSelIds.push(id);
    render();
  },
  nbSelAll: () => {
    const ids = nbFiltered().map(x => x.id);
    const allSel = ids.length > 0 && ids.every(id => nbSelIds.indexOf(id) >= 0);
    nbSelIds = allSel ? [] : ids.slice();
    render();
  },
  nbMove: () => {
    if(!nbSelIds.length) return toast('先勾选要移动的内容 ~');
    openSheet('移入文件夹', folderPickHTML('doMove', '已选 ' + nbSelIds.length + ' ' + nbUnit() + '，选择目标文件夹：'));
  },
  nbMoveOut: () => {
    if(!nbSelIds.length) return toast('先勾选要移出的内容 ~');
    doMoveItems(nbSelIds.slice(), '');
  },
  doMove: el => doMoveItems(nbSelIds.slice(), el.dataset.v || ''),
  /* 单条归类 */
  nbMoveOne: el => { nbMoveOneId = el.dataset.id; openSheet('归类到', folderPickHTML('doMoveOne', '把这一条移到：')); },
  doMoveOne: el => {
    if(!nbMoveOneId) return toast('内容不存在，请重试');
    doMoveItems([nbMoveOneId], el.dataset.v || '');
    nbMoveOneId = '';
  },

  /* 书籍 */
  addBook: () => openSheet('添加书单', bookForm()),
  editBook: el => { const b=DB.bookList.find(x=>x.id===el.dataset.id); openSheet('编辑书单', bookForm(b)); },
  saveBook: el => {
    const name=$('#bName').value.trim(); if(!name) return toast('书名不能为空 ~');
    const item={ id:el.dataset.id||uid(), name:name, author:$('#bAuthor').value.trim(), intro:$('#bIntro').value.trim(), tags:$('#bTags').value.trim(), status:$('#bStatus .on').dataset.v, feeling:$('#bFeel').value.trim() };
    if(el.dataset.id){ const i=DB.bookList.findIndex(x=>x.id===el.dataset.id); DB.bookList[i]=Object.assign({},DB.bookList[i],item); }
    else DB.bookList.push(item);
    save(); closeSheet(); render(); toast('已保存 ~');
  },
  delBook: el => { const id=el.dataset.id; confirmBox('删除这本书？','',()=>{ DB.bookList=DB.bookList.filter(x=>x.id!==id); save(); render(); toast('已删除'); }); },
  addBookFile: () => $('#txtPick').click(),
  openReader: el => openReader(el.dataset.id),
  delLocalBook: el => { const id=el.dataset.id; confirmBox('删除本地书籍？','文件内容会一起删除。',()=>{ DB.localBooks=DB.localBooks.filter(x=>x.id!==id); save(); render(); toast('已删除'); }); },
  rPrev: () => { if(!readerState) return; readerState.pos=Math.max(0,readerState.pos-readerState.PAGE); readerState.b.lastReadPos=readerState.pos; save(); renderReader(); },
  rNext: () => { if(!readerState) return; readerState.pos=Math.min(readerState.total-readerState.PAGE, readerState.pos+readerState.PAGE); if(readerState.pos<0) readerState.pos=Math.max(0,readerState.total-readerState.PAGE); readerState.b.lastReadPos=readerState.pos; save(); renderReader(); },
  rFontMinus: () => { if(!readerState) return; readerState.rsize=Math.max(12,readerState.rsize-2); const rd=$('#reader'); if(rd) rd.style.setProperty('--rsize',readerState.rsize+'px'); },
  rFontPlus: () => { if(!readerState) return; readerState.rsize=Math.min(30,readerState.rsize+2); const rd=$('#reader'); if(rd) rd.style.setProperty('--rsize',readerState.rsize+'px'); },

  /* 设置中心 */
  applyUI: () => { const ui=(DB.ui||(DB.ui={})); ui.themeColor=$('#setColor').value; ui.fontSize=parseInt($('#setFont').value)||15; ui.fontColor=$('#setText').value; save(); applyUIStyles(); toast('已应用 ~'); },
  resetUI: () => {
    DB.ui = {};
    save();
    document.documentElement.style.setProperty('--pink', '#FF9FB6');
    document.documentElement.style.setProperty('--bg', '#FFF7FA');
    document.documentElement.style.setProperty('--card', '#FFFFFF');
    document.documentElement.style.setProperty('--text', '#4B4453');
    document.documentElement.style.setProperty('--muted', '#9C94A6');
    document.body.style.fontSize = '15px';
    render();
    toast('已恢复默认');
  },

  /* 备份 */
  export: doExport,
  import: () => $('#jsonPick').click(),
  copyBackup: doCopy,
  clear: doClear,

  /* 安装到桌面 */
  install: async () => {
    if(!deferredPrompt) return toast('请用浏览器菜单里的「添加到主屏幕」');
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice;
    if(r && r.outcome === 'accepted') toast('添加成功 ~');
    deferredPrompt = null; render();
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const fn = ACT[t.dataset.act];
  if(fn) fn(t, e);
});
/* 表单里的分段选择（点哪段亮哪段） */
document.addEventListener('click', e => {
  const seg = e.target.closest('.seg');
  if(!seg) return;
  const btn = e.target.closest('.seg button');
  if(!btn) return;
  $$('.seg button', seg).forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  if(seg.id === 'bType'){                     // 记账：切换收支 → 刷新分类
    billType = btn.dataset.v;
    billCat = BILL_CATS[billType][0];
    render();
  }
  if(seg.id === 'nbTab'){ notebookTab = btn.dataset.v; render(); }
  if(seg.id === 'bookFilter'){ bookFilter = btn.dataset.v; render(); }
});
/* 颜色预设小圆点：写入弹层里第一个 color 输入框并即时生效 */
document.addEventListener('click', e => {
  const cp = e.target.closest('.cp');
  if(!cp) return;
  const ci = $('#sheetBody input[type=color]');
  if(ci){ ci.value = cp.dataset.color; ci.dispatchEvent(new Event('input', { bubbles: true })); }
});
/* 文件夹预设封面选择：点选后清掉已上传的封面并更新预览 */
document.addEventListener('click', e => {
  const b = e.target.closest('#fdCovers button');
  if(!b) return;
  $$('#fdCovers button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  curCoverPreset = b.dataset.v;
  curImg = '';
  const p = PRESET_COVERS.find(x => x.id === b.dataset.v);
  const prev = $('#fdPrev');
  if(p && prev){ prev.style.background = p.bg; prev.textContent = p.emoji; }
});
document.addEventListener('click', e => {
  const wrap = e.target.closest('#unitChips');
  if(!wrap) return;
  const b = e.target.closest('#unitChips button');
  if(!b) return;
  $$('#unitChips button', wrap).forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  const cu = $('#uCustom'); if(cu) cu.value = '';
});
/* 设置中心：实时调整主题色 / 字号 / 字体颜色（即时生效并落盘） */
document.addEventListener('input', e => {
  if(!DB.ui) DB.ui = {};
  if(e.target.id === 'setColor'){ DB.ui.themeColor = e.target.value; applyUIStyles(); save(); }
  else if(e.target.id === 'setText'){ DB.ui.fontColor = e.target.value; applyUIStyles(); save(); }
  else if(e.target.id === 'setFont'){ DB.ui.fontSize = e.target.value; const v = $('#fsVal'); if(v) v.textContent = e.target.value + 'px'; applyUIStyles(); save(); }
});
/* 分类 chips（记账） */
document.addEventListener('click', e => {
  const b = e.target.closest('#bCat button');
  if(!b) return;
  billCat = b.dataset.v;
  $$('#bCat button').forEach(x => x.classList.toggle('on', x === b));
});
/* 点遮罩关闭弹层 */
$('#mask').addEventListener('click', e => { if(e.target.id === 'mask') closeSheet(); });
/* 选图片 */
$('#filePick').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  const url = await compressImg(f);
  if(url && pickCb) pickCb(url);
  e.target.value = '';
});
/* 导入 JSON */
$('#jsonPick').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  doImport(f); e.target.value = '';
});
/* 上传本地 TXT（仅本机读取，不联网下载） */
$('#txtPick').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    DB.localBooks.push({ id: uid(), fileName: f.name, textContent: String(fr.result), lastReadPos: 0 });
    save(); render(); toast('已导入：' + f.name);
  };
  fr.readAsText(f);
  e.target.value = '';
});

/* ---------------------- 12. 启动 + PWA ---------------------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if(route === 'home') render(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* 本地 file:// 打开时会失败，属正常 */ });
  });
}
/* 保持常亮的历史栈：进入时写入第一条应用状态，返回键才不会直接跳出 */
(function boot(){
  const h = (location.hash || '').replace('#', '');
  route = ROUTES.includes(h) ? h : 'home';
  applyUIStyles();          // 启动时先还原主题色 / 字号 / 字体颜色
  history.replaceState({ r: route }, '', '#' + route);
  go(route, false);
})();
</script>
</body>
</html>
