<style>
/* ===================== 基础与主题 ===================== */

html,body{margin:0;padding:0;}
body{

<script>
/* =====================================================================
   小圈 · 生活小本子  —— 纯前端 PWA（无后端 / 数据全部在 localStorage）
   模块：① 主页（日历 / 纪念日倒计时 / 吉祥物小圈）
        ② 食谱图鉴  ③ 记账  ④ 英语学习（含错词本）
   每个模块底部都有「备份 & 恢复」入口（导出 / 导入 / 复制 / 清空）
   ===================================================================== */

/* ---------------------- 1. 小工具 ---------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => (n < 10 ? '0' : '') + n;
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = () => ymd(new Date());
const parseD = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const DAY = 86400000;
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / DAY);   // b - a，单位天
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = n => (Number(n) || 0).toFixed(2);

let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* 图片压缩：上传前缩到最大 720px，避免 localStorage 爆容量 */
function compressImg(file, max = 720){
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => resolve('');
      img.src = fr.result;
    };
    fr.onerror = () => resolve('');
    fr.readAsDataURL(file);
  });
}

/* ---------------------- 2. 数据层（localStorage） ---------------------- */
const KEY = 'xiaocuan_data_v1';
function defaults(){
  return {
    version: 1,
    days:   [],   // 纪念日 / 倒计时：{id,name,date,type:'memorial'|'countdown',yearly,img,show,note}
    foods:  [],   // 自定义食物：{id,name,cat,img}
    bills:  [],   // 记账：{id,type:'in'|'out',amount,cat,note,date}
    wrong:  [],   // 错词本：{w,n,t}
    learned:[],   // 已掌握单词
    ui: {}        // 各模块的界面小状态
  };
}
let DB = (function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaults();
    return Object.assign(defaults(), JSON.parse(raw));
  }catch(e){ return defaults(); }
})();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('保存失败：存储空间可能已满，删几张图片试试'); }
}

/* ---------------------- 3. 内置静态数据 ---------------------- */
/* 内置食物（固定，不占存储） */
const PRESET_FOODS = [

const ROUTES = ['home', 'recipe', 'money', 'english'];
let route = 'home';
let exitArmed = false;

function go(r, push){
  if(!ROUTES.includes(r)) r = 'home';
  route = r;
  if(push) history.pushState({ r: r }, '', '#' + r);
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.r === r));
  $('#topTag').textContent = { home:'今天 ' + TODAY(), recipe:'今天吃什么？', money:'收支小账本', english:'每天一点点' }[r];
  render();
  window.scrollTo(0, 0);
}
function render(){
  const v = $('#view');
  v.innerHTML = ({ home: viewHome, recipe: viewRecipe, money: viewMoney, english: viewEnglish })[route]();
}
/* 手机返回键：优先在应用内路由回退；已经在首页时，需要连按两次才允许离开（不会一按就跳回浏览器） */
window.addEventListener('popstate', () => {
  const st = history.state || {};
  if(st.m){ return; }            // 弹层内部状态，无需处理
  closeSheet(true);
  if(st.guard && exitArmed){     // 第二次点击返回 → 真正离开
    exitArmed = false;
    if(history.length > 1) history.go(-1);
    return;
  }
  if(!ROUTES.includes(st.r)){    // 已经退到应用之外 → 拉回应用内
    history.pushState({ r: route, guard: 1 }, '', '#' + route);
    exitArmed = true;
    toast('再按一次返回键离开小圈 ~');
    setTimeout(() => { exitArmed = false; }, 2500);
    return;
  }
  go(st.r, false);
});

let sheetOpen = false;
function openSheet(title, html, onMount){
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  $('#mask').classList.remove('hidden');
  sheetOpen = true;
  history.pushState({ r: route, m: 1 }, '');
  if(onMount) onMount($('#sheetBody'));
}
function closeSheet(fromPop){
  if(!sheetOpen) return;
  $('#mask').classList.add('hidden');
  $('#sheetBody').innerHTML = '';
  sheetOpen = false;
  if(!fromPop) history.back();     // 保持历史栈干净：关闭 = 回退一步
}

function doExport(){
  const txt = JSON.stringify(DB, null, 2);
  const blob = new Blob([txt], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '小圈备份-' + TODAY() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('备份已导出 ~');
}
function doCopy(){
  const txt = JSON.stringify(DB);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => toast('已复制，粘贴到备忘录保存吧'), () => toast('复制失败，请用导出文件'));
  }else{
    toast('当前环境不支持复制，请用「导出 JSON」');
  }
}
function doImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    let data;
    try{ data = JSON.parse(fr.result); }
    catch(e){ return toast('文件不是合法的 JSON'); }
    if(typeof data !== 'object' || !data) return toast('文件内容不正确');
    openSheet('导入备份', `<p style="margin:0 0 12px;font-size:14px;color:#6B6478">
        检测到备份文件（纪念日 ${(data.days||[]).length} 条 / 自定义食物 ${(data.foods||[]).length} 条 / 账单 ${(data.bills||[]).length} 条 / 错词 ${(data.wrong||[]).length} 条）。<br>请选择导入方式：</p>
      <div class="field"><button class="btn full" data-act="importMerge">合并导入（保留现有数据）</button></div>
      <div class="field"><button class="btn ghost full" data-act="importReplace">覆盖导入（替换现有数据）</button></div>`,
      body => {
        body.querySelector('[data-act=importMerge]').onclick = () => { mergeData(data); closeSheet(); toast('合并完成 ~'); go(route, false); };
        body.querySelector('[data-act=importReplace]').onclick = () => {
          DB = Object.assign(defaults(), data); save(); closeSheet(); toast('已覆盖导入 ~'); go(route, false);
        };
      });
  };
  fr.readAsText(file);
}
function mergeData(d){
  const has = (arr, k, v) => arr.some(x => x[k] === v);
  (d.days || []).forEach(x => { if(!has(DB.days, 'id', x.id)) DB.days.push(x); });
  (d.foods || []).forEach(x => { if(!has(DB.foods, 'id', x.id)) DB.foods.push(x); });
  (d.bills || []).forEach(x => { if(!has(DB.bills, 'id', x.id)) DB.bills.push(x); });
  (d.wrong || []).forEach(x => {
    const f = DB.wrong.find(y => y.w === x.w);
    if(f) f.n = Math.max(f.n, x.n || 1); else DB.wrong.push(x);
  });
  (d.learned || []).forEach(w => { if(!DB.learned.includes(w)) DB.learned.push(w); });
  save();
}
function doClear(){
  confirmBox('清空全部数据？', '所有纪念日、食物、账单、错词都会被删除，且无法恢复。建议先导出备份。', () => {

  }, '狠心清空');
}

function hiText(){
  const h = new Date().getHours();
  if(h < 6)  return '夜深啦，早点睡，小圈陪你 ~';
  if(h < 11) return '早上好！今天也要元气满满 ✨';
  if(h < 14) return '中午啦，记得好好吃饭 🍚';
  if(h < 18) return '下午好，喝口水休息一下 ~';
  return '晚上好，今天过得怎么样？';
}
function calCells(){
  const start = new Date(cal.y, cal.m, 1).getDay();
  const total = new Date(cal.y, cal.m + 1, 0).getDate();
  let html = '';
  for(let i = 0; i < start; i++) html += '<div class="cell empty"></div>';
  for(let d = 1; d <= total; d++){
    const ds = ymd(new Date(cal.y, cal.m, d));
    const has = DB.days.some(x => x.date === ds) ||
      DB.days.some(x => x.yearly && x.type === 'memorial' && parseD(x.date).getMonth() === cal.m && parseD(x.date).getDate() === d);
    html += `<div class="cell ${ds === TODAY() ? 'today' : ''} ${ds === cal.sel ? 'sel' : ''}"
      data-act="pickDate" data-date="${ds}"><span>${d}</span>${has ? '<i class="dot"></i>' : ''}</div>`;
  }
  return html;
}
function selDayList(){
  const list = DB.days.filter(x => x.date === cal.sel);
  if(!list.length) return '<div class="empty">这一天还没有记录，点右上角添加 ~</div>';
  return list.map(dayItem).join('');
}
function allDaysList(){
  if(!DB.days.length) return '<div class="empty">还没有纪念日，添加一个吧 ~</div>';
  return DB.days.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(dayItem).join('');
}
function dayText(d){
  const t = TODAY();
  const n = diffDays(t, d.date);            // 正数：还有几天；负数：已过去
  if(n > 0)  return `还有 <b>${n}</b> 天 · ${d.date}`;
  if(n === 0) return `<b>就是今天！</b> · ${d.date}`;
  const passed = -n;
  let extra = '';
  if(d.type === 'memorial' && d.yearly){    // 纪念日可选「每年重复」，算下一个周年
    const src = parseD(d.date);
    let next = new Date(parseD(t).getFullYear(), src.getMonth(), src.getDate());
    if(ymd(next) < t) next.setFullYear(next.getFullYear() + 1);
    extra = ` · 距离 ${next.getFullYear() - src.getFullYear()} 周年还有 ${diffDays(t, ymd(next))} 天`;
  }
  return `已经过去 <b>${passed}</b> 天 · ${d.date}${extra}`;
}
function dayItem(d){
  return `<div class="item" data-id="${d.id}">
    <div class="thumb ${d.type === 'countdown' ? 'b' : ''}" ${d.img ? `style="background-image:url(${d.img})"` : ''}>

    <div class="chips">${CATS.map(c => `<button data-act="recipeCat" data-v="${c}" class="${c === recipeCat ? 'on' : ''}">${c}</button>`).join('')}</div>
    <div class="roll mt12">
      ${lastRoll ? rollHTML(lastRoll) : `<div style="font-size:44px">🎲</div>
        <div class="res">今天吃点什么？</div><p class="tip">在「${recipeCat}」里随机抽一个</p>`}
      <div class="btnrow" style="margin-top:14px">
        <button class="btn big" data-act="roll">${lastRoll ? '换一个' : '帮我抽！'}</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row between"><h3>📒 ${recipeCat}图鉴</h3>
      <button class="btn mini" data-act="addFood">+ 新增</button></div>
    <div class="foodgrid">
      ${list.map(f => `<div class="food">
        <div class="fi" ${f.img ? `style="background-image:url(${f.img})"` : ''}>${f.img ? '' : (f.emoji || '🍽️')}</div>
        ${esc(f.name)}
        ${DB.foods.some(x => x.id === f.id) ? `<button class="x" data-act="delFood" data-id="${f.id}">✕</button>` : ''}
      </div>`).join('')}
    </div>
  </section>
  ${backupCard()}`;
}
function rollHTML(f){
  return `<div class="resimg" ${f.img ? `style="background-image:url(${f.img})"` : ''}>${f.img ? '' : (f.emoji || '🍽️')}</div>
    <div class="res">${esc(f.name)}</div><p class="tip">就吃这个吧 ~</p>`;
}
function foodForm(){
  return `
    <div class="imgpick" data-act="pickImg">📷 点这里上传图片（可选）</div>
    <div class="field"><label>食物名称</label><input type="text" id="ffName" placeholder="例如：楼下的牛肉面"></div>
    <div class="field"><label>分类</label>
      <div class="seg" id="ffCat">${CATS.map((c, i) => `<button data-v="${c}" class="${c === recipeCat ? 'on' : ''}">${c}</button>`).join('')}</div></div>
    <button class="btn full" data-act="saveFood">保存</button>`;
}

/* ---------------------- 9. 记账 ---------------------- */
let billType = 'out', billCat = '餐饮', billRange = 'month';
function viewMoney(){
  const now = new Date(), prefix = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  const list = DB.bills.filter(b => billRange === 'month' ? b.date.slice(0, 7) === prefix : true)
    .slice().sort((a, b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
  let income = 0, outcome = 0;
  list.forEach(b => { if(b.type === 'in') income += Number(b.amount) || 0; else outcome += Number(b.amount) || 0; });
  const pct = income + outcome > 0 ? Math.round(outcome / (income + outcome) * 100) : 0;

  return `
  <section class="card">
    <div class="row between" style="margin-bottom:10px">
      <h3>💰 收支统计</h3>
      <div class="seg" style="width:150px">
        <button data-act="range" data-v="month" class="${billRange === 'month' ? 'on' : ''}">本月</button>
        <button data-act="range" data-v="all" class="${billRange === 'all' ? 'on' : ''}">全部</button>
      </div>
    </div>
    <div class="sum">
      <div><div class="n in">+${money(income)}</div><div class="l">收入</div></div>
      <div><div class="n out">-${money(outcome)}</div><div class="l">支出</div></div>
      <div><div class="n">${money(income - outcome)}</div><div class="l">结余</div></div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="tip">支出占总流水 ${pct}%（共 ${list.length} 笔）</p>
  </section>

  <section class="card">
    <h3>✍️ 记一笔</h3>
    <div class="seg mt8" id="bType">
      <button data-v="out" class="${billType === 'out' ? 'on' : ''}">支出</button>
      <button data-v="in" class="${billType === 'in' ? 'on' : ''}">收入</button>
    </div>
    <div class="field mt12"><label>金额（元）</label>
      <input type="number" inputmode="decimal" step="0.01" id="bAmount" placeholder="0.00"></div>
    <div class="field"><label>分类</label>
      <div class="chips" id="bCat">${BILL_CATS[billType].map(c => `<button data-v="${c}" class="${c === billCat ? 'on' : ''}">${c}</button>`).join('')}</div></div>
    <div class="field"><label>备注</label><input type="text" id="bNote" placeholder="例如：和小圈吃火锅"></div>
    <div class="field"><label>日期</label><input type="date" id="bDate" value="${TODAY()}"></div>
    <button class="btn full" data-act="addBill">保存这一笔</button>
  </section>

  <section class="card">
    <div class="row between"><h3>🧾 明细</h3><span class="chip">${list.length} 笔</span></div>
    <div class="list mt8">${list.length ? list.map(billItem).join('') : '<div class="empty">还没有记录，记一笔吧 ~</div>'}</div>
  </section>
  ${backupCard()}`;
}
function billItem(b){
  return `<div class="item" data-id="${b.id}">
    <div class="thumb ${b.type === 'in' ? 'm' : 'y'}">${b.type === 'in' ? '💵' : '🧾'}</div>
    <div class="grow">
      <div class="t">${esc(b.cat)}<span class="chip ${b.type === 'in' ? 'm' : 'y'}">${b.type === 'in' ? '收入' : '支出'}</span></div>
      <div class="s">${b.date}${b.note ? ' · ' + esc(b.note) : ''}</div>
    </div>
    <div style="text-align:right">
      <div style="font-weight:800" class="${b.type === 'in' ? 'in' : 'out'}">${b.type === 'in' ? '+' : '-'}${money(b.amount)}</div>
      <button class="link del" data-act="delBill">删除</button>
    </div>
  </div>`;
}

/* ---------------------- 10. 英语学习 ---------------------- */
let eng = { mode: 'card', idx: 0, flip: false, q: null, picked: '' };
function viewEnglish(){
  const total = WORDS.length, learned = DB.learned.length;
  const pct = Math.round(learned / total * 100);
  return `
  <section class="card">
    <div class="row between"><h3>📖 学习进度</h3><span class="chip">${learned} / ${total}</span></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="seg mt12" id="eMode">
      <button data-v="card"  class="${eng.mode === 'card' ? 'on' : ''}">背单词</button>
      <button data-v="quiz"  class="${eng.mode === 'quiz' ? 'on' : ''}">测一测</button>
      <button data-v="wrong" class="${eng.mode === 'wrong' ? 'on' : ''}">错词本 ${DB.wrong.length ? '(' + DB.wrong.length + ')' : ''}</button>
    </div>
  </section>
  <section class="card">${engBody()}</section>
  ${backupCard()}`;
}
function engBody(){
  if(eng.mode === 'card')  return engCard();
  if(eng.mode === 'quiz')  return engQuiz();
  return engWrong();
}
function engCard(){
  const w = WORDS[eng.idx];
  return `<div class="wcard">
    <div class="w">${w.w}</div><div class="ph">${w.ph}</div>
    ${eng.flip ? `<div class="cn">${w.cn}</div>
      <div class="ex">${w.en}<small>${w.zh}</small></div>` : `<p class="tip" style="margin-top:14px">想一想它的意思 ~</p>`}
  </div>
  <div class="btnrow">
    <button class="btn ghost" data-act="engPrev">上一个</button>
    <button class="btn" data-act="engFlip">${eng.flip ? '盖住' : '看释义'}</button>
    <button class="btn ghost" data-act="engNext">下一个</button>
  </div>
  <div class="btnrow"><button class="btn ghost" data-act="engKnow">✅ 记住了（标记已掌握）</button></div>
  <p class="tip" style="text-align:center">第 ${eng.idx + 1} / ${WORDS.length} 个</p>`;
}
function makeQuestion(pool){
  const w = pool[Math.floor(Math.random() * pool.length)];
  const opts = [w.cn];
  while(opts.length < 4){
    const c = WORDS[Math.floor(Math.random() * WORDS.length)].cn;
    if(!opts.includes(c)) opts.push(c);
  }
  opts.sort(() => Math.random() - 0.5);
  eng.q = { w, opts };
  eng.picked = '';
}
function engQuiz(){
  if(!eng.q) makeQuestion(WORDS);
  const q = eng.q;
  return `<div class="wcard">
    <div class="w">${q.w.w}</div><div class="ph">${q.w.ph}</div>
    <p class="tip" style="margin-top:10px">选出正确的中文意思</p>
  </div>
  <div class="mt12">
    ${q.opts.map(o => `<button class="opt ${eng.picked ? (o === q.w.cn ? 'right' : (o === eng.picked ? 'wrong' : '')) : ''}"
      data-act="engPick" data-v="${esc(o)}">${esc(o)}</button>`).join('')}
  </div>
  ${eng.picked ? `<p class="tip" style="text-align:center;margin-top:10px">
      ${eng.picked === q.w.cn ? '答对啦！小圈给你鼓掌 👏' : '记错啦，已经放进错词本 ~'}
      <br>${q.w.en}<br><small>${q.w.zh}</small></p>
      <div class="btnrow"><button class="btn" data-act="engNextQ">下一题</button></div>` : ''}`;
}
function engWrong(){
  if(!DB.wrong.length) return '<div class="empty">错词本是空的，说明你很棒 🌟</div>';
  return `<div class="list">
    ${DB.wrong.map(x => { const w = WORDS.find(y => y.w === x.w) || { w:x.w, ph:'', cn:'' };
      return `<div class="item" data-w="${esc(x.w)}">
        <div class="thumb b">🔁</div>
        <div class="grow"><div class="t">${esc(w.w)} <span class="chip b">错 ${x.n} 次</span></div>
          <div class="s">${esc(w.ph)} ${esc(w.cn)}</div></div>
        <button class="link" data-act="wrongDrill">练它</button>
        <button class="link del" data-act="wrongDel">移除</button>
      </div>`; }).join('')}
  </div>
  <div class="btnrow"><button class="btn" data-act="wrongQuiz">开始错词练习</button></div>`;
}

/* ---------------------- 11. 事件统一处理 ---------------------- */
let curImg = '';        // 弹层里当前选择的图片
let pickCb = null;      // 图片选择回调

const ACT = {
  /* 底部导航 */
  tab: el => { const r = el.dataset.r; if(r !== route) go(r, true); },

  /* 弹层 */
  sheetClose: () => closeSheet(),
  pickImg: () => { pickCb = url => { curImg = url; const p = $('#sheetBody .imgpick'); if(p){ p.style.backgroundImage = 'url(' + url + ')'; p.textContent = ''; } }; $('#filePick').click(); },

  /* 日历 */
  calPrev: () => { cal.m--; if(cal.m < 0){ cal.m = 11; cal.y--; } render(); },
  calNext: () => { cal.m++; if(cal.m > 11){ cal.m = 0; cal.y++; } render(); },
  pickDate: el => { cal.sel = el.dataset.date; render(); },

  /* 纪念日 */
  addDay: () => { curImg = ''; openSheet('添加纪念日 / 倒计时', dayForm()); },
  editDay: el => { const d = DB.days.find(x => x.id === el.closest('.item').dataset.id); curImg = d.img || ''; openSheet('编辑', dayForm(d)); },
  saveDay: el => saveDay(el.dataset.id),
  delDay: el => {
    const id = el.closest('.item').dataset.id;
    confirmBox('删除这条记录？', '删除后无法恢复哦。', () => { DB.days = DB.days.filter(x => x.id !== id); save(); render(); toast('已删除'); });
  },
  toggleShow: el => {
    const d = DB.days.find(x => x.id === el.closest('.item').dataset.id);
    d.show = el.checked; save(); toast(d.show ? '已显示在主页 ~' : '已从主页隐藏');
  },
  mascot: () => {
    const b = $('#bubble');
    b.textContent = '小圈：' + MASCOT_LINES[Math.floor(Math.random() * MASCOT_LINES.length)];
    b.classList.remove('hidden');
    clearTimeout(ACT._t); ACT._t = setTimeout(() => b.classList.add('hidden'), 3200);
  },

  /* 食谱 */
  recipeCat: el => { recipeCat = el.dataset.v; lastRoll = null; render(); },
  roll: () => { const l = foodsOf(recipeCat); lastRoll = l[Math.floor(Math.random() * l.length)]; render(); },
  addFood: () => { curImg = ''; openSheet('新增食物', foodForm()); },
  saveFood: () => {
    const name = $('#ffName').value.trim();
    if(!name) return toast('先写下它的名字 ~');
    const cat = $('#ffCat .on').dataset.v;          // 先取值再关弹层（关弹层会清空表单 DOM）
    DB.foods.push({ id: uid(), name, cat, img: curImg });
    save(); closeSheet(); recipeCat = cat; render(); toast('已加入图鉴 ~');
  },
  delFood: el => {
    const id = el.dataset.id;
    confirmBox('删除这个食物？', '只会删除你自己添加的食物。', () => { DB.foods = DB.foods.filter(x => x.id !== id); save(); render(); toast('已删除'); });
  },

  /* 记账 */
  range: el => { billRange = el.dataset.v; render(); },
  addBill: () => {
    const amount = parseFloat($('#bAmount').value);
    if(!(amount > 0)) return toast('金额要大于 0 哦');
    DB.bills.push({
      id: uid(), type: billType, amount: amount.toFixed(2),
      cat: billCat, note: $('#bNote').value.trim(), date: $('#bDate').value || TODAY()
    });
    save(); render(); toast('记好啦 ~');
  },
  delBill: el => {
    const id = el.closest('.item').dataset.id;
    confirmBox('删除这笔账？', '删除后统计也会变化。', () => { DB.bills = DB.bills.filter(x => x.id !== id); save(); render(); toast('已删除'); });
  },

  /* 英语 */
  engFlip: () => { eng.flip = !eng.flip; render(); },
  engPrev: () => { eng.idx = (eng.idx - 1 + WORDS.length) % WORDS.length; eng.flip = false; render(); },
  engNext: () => { eng.idx = (eng.idx + 1) % WORDS.length; eng.flip = false; render(); },
  engKnow: () => {
    const w = WORDS[eng.idx].w;
    if(!DB.learned.includes(w)){ DB.learned.push(w); save(); }
    toast('真棒！已标记为掌握 ⭐'); render();
  },
  engPick: el => {
    if(eng.picked) return;
    eng.picked = el.dataset.v;
    const w = eng.q.w;
    if(eng.picked === w.cn){
      if(!DB.learned.includes(w.w)) DB.learned.push(w.w);
      DB.wrong = DB.wrong.filter(x => x.w !== w.w);
    }else{
      const f = DB.wrong.find(x => x.w === w.w);
      if(f) f.n++; else DB.wrong.push({ w: w.w, n: 1, t: TODAY() });
      DB.learned = DB.learned.filter(x => x !== w.w);
    }
    save(); render();
  },
  engNextQ: () => {
    const pool = eng.wrongOnly ? WORDS.filter(x => DB.wrong.some(y => y.w === x.w)) : WORDS;
    if(eng.picked === eng.q.w.cn && eng.wrongOnly){     // 错词练习答对 → 减一次，归零则移除
      const f = DB.wrong.find(x => x.w === eng.q.w.w);
      if(f){ f.n--; if(f.n <= 0) DB.wrong = DB.wrong.filter(y => y.w !== f.w); save(); }
      if(!DB.wrong.length) eng.wrongOnly = false;
    }
    makeQuestion(pool.length ? pool : WORDS);
    render();
  },
  wrongDrill: el => { eng.mode = 'quiz'; eng.wrongOnly = true; makeQuestion(WORDS.filter(x => x.w === el.closest('.item').dataset.w)); render(); },
  wrongDel: el => { const w = el.closest('.item').dataset.w; DB.wrong = DB.wrong.filter(x => x.w !== w); save(); render(); toast('已移出错词本'); },
  wrongQuiz: () => { eng.mode = 'quiz'; eng.wrongOnly = true; makeQuestion(WORDS.filter(x => DB.wrong.some(y => y.w === x.w))); render(); },

  /* 备份 */
  export: doExport,
  import: () => $('#jsonPick').click(),
  copyBackup: doCopy,
  clear: doClear,

  /* 安装到桌面 */
  install: async () => {
    if(!deferredPrompt) return toast('请用浏览器菜单里的「添加到主屏幕」');
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice;
    if(r && r.outcome === 'accepted') toast('添加成功 ~');
    deferredPrompt = null; render();
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const fn = ACT[t.dataset.act];
  if(fn) fn(t, e);
});
/* 表单里的分段选择（点哪段亮哪段） */
document.addEventListener('click', e => {
  const seg = e.target.closest('.seg');
  if(!seg) return;
  const btn = e.target.closest('.seg button');
  if(!btn) return;
  $$('.seg button', seg).forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  if(seg.id === 'bType'){                     // 记账：切换收支 → 刷新分类
    billType = btn.dataset.v;
    billCat = BILL_CATS[billType][0];
    render();
  }
  if(seg.id === 'eMode'){
    eng.mode = btn.dataset.v;
    if(eng.mode === 'quiz'){ eng.wrongOnly = false; makeQuestion(WORDS); }
    render();
  }
});
/* 分类 chips（记账） */
document.addEventListener('click', e => {
  const b = e.target.closest('#bCat button');
  if(!b) return;
  billCat = b.dataset.v;
  $$('#bCat button').forEach(x => x.classList.toggle('on', x === b));
});
/* 点遮罩关闭弹层 */
$('#mask').addEventListener('click', e => { if(e.target.id === 'mask') closeSheet(); });
/* 选图片 */
$('#filePick').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  const url = await compressImg(f);
  if(url && pickCb) pickCb(url);
  e.target.value = '';
});
/* 导入 JSON */
$('#jsonPick').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  doImport(f); e.target.value = '';
});

/* ---------------------- 12. 启动 + PWA ---------------------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if(route === 'home') render(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* 本地 file:// 打开时会失败，属正常 */ });
  });
}
/* 保持常亮的历史栈：进入时写入第一条应用状态，返回键才不会直接跳出 */
(function boot(){
  const h = (location.hash || '').replace('#', '');
  route = ROUTES.includes(h) ? h : 'home';
  history.replaceState({ r: route }, '', '#' + route);
  go(route, false);
})();
</script>
</body>
</html>
